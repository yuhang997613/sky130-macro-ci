name: sky130-macro

on:
  push:
    paths:
      - "sky130/**"
      - ".github/workflows/sky130-macro.yml"
  workflow_dispatch:

jobs:
  macro:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Pull ORFS image (with retries)
        run: |
          for i in 1 2 3; do
            docker pull openroad/orfs:latest && break || sleep 15
          done
          docker image inspect openroad/orfs:latest > /dev/null

      - name: Synthesize + place & route (OpenROAD)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work openroad/orfs:latest bash -lc '
            set -e
            source /OpenROAD-flow-scripts/env.sh 2>/dev/null || true
            export PATH=$PATH:/OpenROAD-flow-scripts/tools/install/OpenROAD/bin:/OpenROAD-flow-scripts/tools/install/yosys/bin
            mkdir -p sky130/out
            yosys -s sky130/synth/synth_mlc_macro.ys 2>&1 | tail -5
            openroad -no_init -exit sky130/pnr/run_mlc_macro_route_fix.tcl 2>&1 | tail -20
            ls -l sky130/out
          '

      - name: Install PDK + KLayout/Netgen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends klayout netgen-lvs python3-pip
          pip3 install --no-cache-dir volare
          volare enable --pdk sky130 0fe599b2afb6708d281543108caf8310912f54af
          echo "PDK_ROOT=$HOME/.volare" >> "$GITHUB_ENV"

      - name: DEF -> GDS (KLayout def2stream, std cells + OpenRAM macro)
        run: |
          docker run --rm             -v "$GITHUB_WORKSPACE:/work"             -v "$HOME/.volare:/pdk"             -w /work openroad/orfs:latest bash -lc '
            set -e
            klayout -zz               -rd tech_file=/OpenROAD-flow-scripts/flow/platforms/sky130hd/sky130hd.lyt               -rd layer_map=               -rd in_def=/work/sky130/out/mlc_storage_macro.def               -rd design_name=mlc_storage_macro               -rd in_files="/pdk/sky130A/libs.ref/sky130_fd_sc_hd/gds/sky130_fd_sc_hd.gds /work/sky130/macros/sky130_sram_1kbyte_1rw1r_32x256_8/sky130_sram_1kbyte_1rw1r_32x256_8.gds"               -rd seal_file=               -rd out_file=/work/sky130/out/mlc_storage_macro_merged.gds               -r /OpenROAD-flow-scripts/flow/util/def2stream.py
            ls -l /work/sky130/out/mlc_storage_macro_merged.gds
          '

      - name: DRC (KLayout in ORFS container)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -v "$HOME/.volare:/pdk" -w /work openroad/orfs:latest bash -lc '
            klayout -b -r /pdk/sky130A/libs.tech/klayout/drc/sky130A_mr.drc -rd input=/work/sky130/out/mlc_storage_macro_merged.gds -rd report=/work/sky130/out/drc_macro.lyrdb -rd topcell=mlc_storage_macro
          '
          test -s sky130/out/drc_macro.lyrdb || echo "DRC deck produced no report"

      - name: LVS (KLayout in ORFS container, SPICE schematic)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -v "$HOME/.volare:/pdk" -w /work openroad/orfs:latest bash -lc '
            set -x
            source /OpenROAD-flow-scripts/env.sh 2>/dev/null || true
            export PATH=$PATH:/OpenROAD-flow-scripts/tools/install/OpenROAD/bin:/OpenROAD-flow-scripts/tools/install/yosys/bin
            PDK=/pdk/sky130A
            yosys -p "read_verilog /work/sky130/out/mlc_storage_macro_routed.v; write_spice /work/sky130/out/routed.sp" || true
            sed -E "s/([[:space:]])sky130_sram_1kbyte_1rw1r_32x256_8[[:space:]]*$/\1vccd1 vssd1 sky130_sram_1kbyte_1rw1r_32x256_8/" /work/sky130/out/routed.sp > /work/sky130/out/routed_fixed.sp || true
            sed -E "s/^(X[0-9]+[[:space:]].*[[:space:]])sky130_fd_sc_hd__([a-zA-Z0-9_]+)[[:space:]]*$/\1VDD VSS VPB VNB sky130_fd_sc_hd__\2/" /work/sky130/out/routed_fixed.sp > /work/sky130/out/routed_fixed2.sp || true
            printf ".GLOBAL vccd1 vssd1 VDD VSS VPB VNB\n" > /work/sky130/out/lvs_schematic.sp
            { cat "$PDK/libs.ref/sky130_fd_sc_hd/spice/sky130_fd_sc_hd.spice" /work/sky130/out/routed_fixed2.sp /work/sky130/macros/sky130_sram_1kbyte_1rw1r_32x256_8/sky130_sram_1kbyte_1rw1r_32x256_8.sp >> /work/sky130/out/lvs_schematic.sp; } || true
            DECK=$(ls /pdk/sky130A/libs.tech/klayout/lvs/*.lvs 2>/dev/null | head -1)
            echo "LVS deck: $DECK"
            if [ -n "$DECK" ]; then
              klayout -b -r "$DECK" -rd input=/work/sky130/out/mlc_storage_macro_merged.gds -rd schematic=/work/sky130/out/lvs_schematic.sp -rd report=/work/sky130/out/lvs_macro.rpt -rd topcell=mlc_storage_macro || true
            fi
          '
          test -s sky130/out/lvs_macro.rpt || echo "LVS deck produced no report"

      - uses: actions/upload-artifact@v4
        with:
          name: sky130-macro-artifacts
          path: sky130/out/
          if-no-files-found: warn
