name: sky130-macro

on:
  push:
    paths:
      - "sky130/**"
      - ".github/workflows/sky130-macro.yml"
  workflow_dispatch:

jobs:
  macro:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Pull ORFS image (with retries)
        run: |
          for i in 1 2 3; do
            docker pull openroad/orfs:latest && break || sleep 15
          done
          docker image inspect openroad/orfs:latest > /dev/null
          docker run --rm openroad/orfs:latest bash -lc "ls /OpenROAD-flow-scripts 2>/dev/null || true; find / -maxdepth 5 -name openroad -type f 2>/dev/null | head -3; find / -maxdepth 5 -name yosys -type f 2>/dev/null | head -3"

      - name: Synthesize + place & route + GDS inside ORFS
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work openroad/orfs:latest bash -lc '
            set -e
            source /OpenROAD-flow-scripts/env.sh 2>/dev/null || true
            export PATH=$PATH:/OpenROAD-flow-scripts/tools/install/OpenROAD/bin:/OpenROAD-flow-scripts/tools/install/yosys/bin
            command -v yosys || true
            command -v openroad || true
            mkdir -p sky130/out
            yosys -s sky130/synth/synth_mlc_macro.ys 2>&1 | tail -5
            openroad -no_init -exit sky130/pnr/run_mlc_macro_route_fix.tcl 2>&1 | tail -30
            ls -l sky130/out
          '

      - name: Install PDK + KLayout/Netgen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends klayout netgen-lvs python3-pip
          pip3 install --no-cache-dir volare klayout
          volare enable --pdk sky130 0fe599b2afb6708d281543108caf8310912f54af
          echo "PDK_ROOT=$HOME/.volare" >> "$GITHUB_ENV"

      - name: GDS check
        run: |
          test -f sky130/out/mlc_storage_macro.gds || { echo "no GDS from OpenROAD"; exit 1; }
          ls -l sky130/out/mlc_storage_macro.gds

      - name: Merge OpenRAM macro GDS
        run: |
          python3 sky130/klayout/merge_macro.py \
            sky130/out/mlc_storage_macro.gds \
            sky130/macros/sky130_sram_1kbyte_1rw1r_32x256_8/sky130_sram_1kbyte_1rw1r_32x256_8.gds \
            sky130/out/mlc_storage_macro_merged.gds 64 64

      - name: DRC (KLayout sky130A_mr.drc)
        run: |
          bash sky130/drc/run_drc.sh sky130/out/mlc_storage_macro_merged.gds sky130/out/drc_macro.lyrdb
          test -s sky130/out/drc_macro.lyrdb

      - name: LVS (KLayout sky130A.lvs / Netgen)
        run: |
          bash sky130/lvs/run_lvs.sh sky130/out/mlc_storage_macro_merged.gds \
               sky130/out/mlc_storage_macro_routed.v sky130/out/lvs_macro.rpt
          test -s sky130/out/lvs_macro.rpt

      - uses: actions/upload-artifact@v4
        with:
          name: sky130-macro-artifacts
          path: sky130/out/
          if-no-files-found: warn
